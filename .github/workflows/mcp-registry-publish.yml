name: Publish to MCP Registry
on:
  push:
    branches: [mcp-registry-publish]
    paths: [mcp-registry/server.json, .github/workflows/mcp-registry-publish.yml]
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher v1.8.9
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        working-directory: mcp-registry
        run: ../mcp-publisher publish
